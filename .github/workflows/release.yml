name: Release

on:
  push:
    branches:
      - 'main'

permissions:
  contents: write

jobs:
  qa:
    name: QA (${{ matrix.image-tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image-tag:
          - latest
          - preview
    env:
      EVENTSOURCINGDB_IMAGE_TAG: ${{ matrix.image-tag }}

    steps:
    - name: Clone repository
      uses: actions/checkout@v7.0.1
    - name: Use Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: ./go.mod
    - name: Run QA
      run: make qa

  release:
    name: Release
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Clone repository
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Get next version
      id: get_next_version
      uses: thenativeweb/get-next-version@2.8.2
    - name: Create new version
      if: ${{ steps.get_next_version.outputs.hasNextVersion == 'true' }}
      run: |
        git tag v${{steps.get_next_version.outputs.version}}
        git push origin v${{steps.get_next_version.outputs.version}}
